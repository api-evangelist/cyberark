  - https://www.cyberark.com/products/
notes: No public pricing. Replace meter targets with contract-derived values (per-privileged-user, per-machine-identity,
  per-workforce-user).
principles:
  - name: Visibility
    description: Use CyberArk Identity Security Intelligence and the per-product admin consoles to count
      privileged users, machine identities, and workforce seats; export to your CMDB / FinOps store.
  - name: Allocation
    description: Tag Safes (PAM), platforms, and Conjur policy branches by business unit / application
      to attribute identity spend; use Identity Flows for joiner/mover/leaver attribution.
  - name: Optimization
    description: Decommission unused privileged / workforce seats at quarterly access reviews; consolidate
      Conjur secrets across applications; right-size Privilege Cloud vs Self-Hosted PAM by deployment
      density.
  - name: Accountability
    description: Identity / security org owns the CyberArk contract; coordinate with finance for chargeback
      based on Safe ownership and identity governance rollups.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Allocation
      - Reporting and Analytics
  - name: Quantify Business Value
    capabilities:
      - Forecasting
      - Budgeting
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Workload Optimization
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
