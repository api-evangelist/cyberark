- aid: cyberark:privilege-cloud
  name: CyberArk Privilege Cloud REST API
  description: >-
    The Privilege Cloud Shared Services REST API mirrors the PAM Self-Hosted surface for accounts, safes,
    platforms, and users while running as a SaaS on the CyberArk Identity Security Platform. Identities
    and groups reference the tenant's CyberArk Identity directory.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://docs.cyberark.com/privilege-cloud-shared-services/latest/en/content/sdk/sdk-overview.htm
