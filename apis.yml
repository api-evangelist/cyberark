- aid: cyberark:identity
  name: CyberArk Identity REST API
  description: >-
    The CyberArk Identity REST API enables programmatic management of users, roles, applications, MFA
    policies, SSO, and SCIM-based provisioning across the workforce identity tenant. Tenants are addressed
    at {tenant}.id.cyberark.cloud and authentication uses OAuth2.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.cyberark.com/identity/Latest/en/Content/Developer/Developer.htm
