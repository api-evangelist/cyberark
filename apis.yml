- aid: cyberark:pam-self-hosted
  name: CyberArk PAM Self-Hosted REST API
  description: >-
    The Privileged Access Manager Self-Hosted REST API exposes the Vault for managing accounts, safes,
    platforms, users, sessions, and applications. Authentication uses the Logon endpoint at /PasswordVault/API/Auth/{provider}/Logon
    to obtain a session token used in the Authorization header for subsequent calls.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://docs.cyberark.com/pam-self-hosted/latest/en/content/webservices/implementing%20privileged%20account%20security%20web%20services%20.htm
  tags:
