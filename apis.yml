aid: cyberark
name: CyberArk
kind: company
description: >-
  CyberArk is the global leader in identity security, providing a unified Identity Security Platform that protects
  human, machine, and application identities across hybrid and multi-cloud environments. Core product lines include
  Privileged Access Manager (PAM Self-Hosted) and Privilege Cloud for credential vaulting and session management; Conjur
  Secrets Manager (Open Source, Enterprise, and Cloud) for machine-identity and DevOps secrets; CyberArk Identity for
  workforce SSO, MFA, and lifecycle; Endpoint Privilege Manager for least-privilege enforcement on Windows / macOS /
  Linux endpoints; Secure Cloud Access for just-in-time cloud entitlements; and Customer Identity for B2B / B2C
  identity. CyberArk publishes a canonical OpenAPI 3.1 specification for Conjur Secrets Manager at
  github.com/cyberark/conjur-openapi-spec, and REST APIs for PAM Self-Hosted, Privilege Cloud, and CyberArk Identity are
  documented on docs.cyberark.com and developer.cyberark.com.
url: https://raw.githubusercontent.com/api-evangelist/cyberark/refs/heads/main/apis.yml
