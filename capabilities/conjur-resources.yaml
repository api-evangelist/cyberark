naftiko: 1.0.0-alpha2
info:
  label: CyberArk Conjur Secrets Manager API — Resources
  description: 'CyberArk Conjur Secrets Manager API — Resources. 2 operations. Lead operation: List resources. Self-contained
    Naftiko capability covering one Cyberark business surface.'
  tags:
  - Cyberark
  - Resources
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CYBERARK_API_KEY: CYBERARK_API_KEY
capability:
  consumes:
  - type: http
    namespace: conjur-resources
    baseUri: https://conjur.example.com
    description: CyberArk Conjur Secrets Manager API — Resources business capability. Self-contained, no shared references.
    resources:
    - name: resources-account
      path: /resources/{account}
      operations:
      - name: listresources
        method: GET
        description: List resources
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: account
          in: path
          type: string
          required: true
        - name: kind
          in: query
          type: string
        - name: search
          in: query
          type: string
        - name: limit
          in: query
          type: integer
        - name: offset
          in: query
          type: integer
    - name: resources-account-kind-identifier
      path: /resources/{account}/{kind}/{identifier}
      operations:
      - name: showresource
        method: GET
        description: Show resource
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: account
          in: path
          type: string
          required: true
        - name: kind
          in: path
          type: string
          required: true
        - name: identifier
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.CYBERARK_API_KEY}}'
  exposes:
  - type: rest
    namespace: conjur-resources-rest
    port: 8080
    description: REST adapter for CyberArk Conjur Secrets Manager API — Resources. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/resources/{account}
      name: resources-account
      description: REST surface for resources-account.
      operations:
      - method: GET
        name: listresources
        description: List resources
        call: conjur-resources.listresources
        with:
          account: rest.account
          kind: rest.kind
          search: rest.search
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/resources/{account}/{kind}/{identifier}
      name: resources-account-kind-identifier
      description: REST surface for resources-account-kind-identifier.
      operations:
      - method: GET
        name: showresource
        description: Show resource
        call: conjur-resources.showresource
        with:
          account: rest.account
          kind: rest.kind
          identifier: rest.identifier
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: conjur-resources-mcp
    port: 9090
    transport: http
    description: MCP adapter for CyberArk Conjur Secrets Manager API — Resources. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-resources
      description: List resources
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: conjur-resources.listresources
      with:
        account: tools.account
        kind: tools.kind
        search: tools.search
        limit: tools.limit
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
    - name: show-resource
      description: Show resource
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: conjur-resources.showresource
      with:
        account: tools.account
        kind: tools.kind
        identifier: tools.identifier
      outputParameters:
      - type: object
        mapping: $.
