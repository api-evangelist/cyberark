naftiko: 1.0.0-alpha2
info:
  label: CyberArk Conjur Secrets Manager API — PublicKeys
  description: 'CyberArk Conjur Secrets Manager API — PublicKeys. 1 operations. Lead operation: Show public keys for resource.
    Self-contained Naftiko capability covering one Cyberark business surface.'
  tags:
  - Cyberark
  - PublicKeys
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CYBERARK_API_KEY: CYBERARK_API_KEY
capability:
  consumes:
  - type: http
    namespace: conjur-publickeys
    baseUri: https://conjur.example.com
    description: CyberArk Conjur Secrets Manager API — PublicKeys business capability. Self-contained, no shared references.
    resources:
    - name: public_keys-account-kind-identifier
      path: /public_keys/{account}/{kind}/{identifier}
      operations:
      - name: showpublickeys
        method: GET
        description: Show public keys for resource
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: account
          in: path
          type: string
          required: true
        - name: kind
          in: path
          type: string
          required: true
        - name: identifier
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.CYBERARK_API_KEY}}'
  exposes:
  - type: rest
    namespace: conjur-publickeys-rest
    port: 8080
    description: REST adapter for CyberArk Conjur Secrets Manager API — PublicKeys. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/public-keys/{account}/{kind}/{identifier}
      name: public-keys-account-kind-identifier
      description: REST surface for public_keys-account-kind-identifier.
      operations:
      - method: GET
        name: showpublickeys
        description: Show public keys for resource
        call: conjur-publickeys.showpublickeys
        with:
          account: rest.account
          kind: rest.kind
          identifier: rest.identifier
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: conjur-publickeys-mcp
    port: 9090
    transport: http
    description: MCP adapter for CyberArk Conjur Secrets Manager API — PublicKeys. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: show-public-keys-resource
      description: Show public keys for resource
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: conjur-publickeys.showpublickeys
      with:
        account: tools.account
        kind: tools.kind
        identifier: tools.identifier
      outputParameters:
      - type: object
        mapping: $.
